<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyScript JSON loader</title>
    <script type="module" src="https://pyscript.net/releases/2024.10.2/core.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.2/core.css" />
  </head>
  <body>
    <h1>Loading JSON files</h1>
    <div id="output"></div>
    <script>
      if (!crypto.randomUUID) {
        crypto.randomUUID = function () {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        };
      }
    </script>
    <py-script src="./main.py"></py-script>
  </body>
</html>
