<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
  <title>Kuukausipäivät</title>
</head>
<body>
  <label>Vuosi:
    <input id="vuosi" type="number" value="2024" />
  </label><br>

  <label>Kuukausi:
    <input id="kuukausi" type="number" min="1" max="12" value="2" />
  </label><br>

  <button id="laske">Laske</button>
  <p id="tulos"></p>

  <script type="py">
    import calendar
    from pyscript import document, when

    def paivia_kuukaudessa(v, k):
        if k in [1, 3, 5, 7, 8, 10, 12]:
            return 31
        elif k in [4, 6, 9, 11]:
            return 30
        elif k == 2:
            return 29 if calendar.isleap(v) else 28
        return 0

    @when("click", "#laske")
    def laske(event):
        v = int(document.querySelector("#vuosi").value)
        k = int(document.querySelector("#kuukausi").value)
        p = paivia_kuukaudessa(v, k)
        document.querySelector("#tulos").innerText = f"Kuukauden päivien määrä: {p}"
  </script>
</body>
</html>
